<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Meatplus Check Printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#16201D; --muted:#56655F; --line:#D0DAD4;
  --accent:#1E5A4D; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4;
  --warn:#8E5409; --warn-soft:#F6E9D2; --bad:#A1262B; --bad-soft:#F7DEDD; --good:#256A2C; --good-soft:#DDEEDB;
  --info:#1D4F86; --info-soft:#DDE8F5;
  --leaf:#EEF4F0; --leaf-pattern:#BFD6CA; --leaf-ink:#3F6B8A; --print:#0B0B0B; --focus:#2D7FF9;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E2EBE7; --muted:#95A59E; --line:#2A3632;
    --accent:#78C2AB; --accent-ink:#0A1814; --accent-soft:#1D3931;
    --warn:#E3A857; --warn-soft:#382A13; --bad:#F08C86; --bad-soft:#3C1D1C; --good:#90CC90; --good-soft:#1C321F;
    --info:#8DB7EA; --info-soft:#18283B; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E2EBE7; --muted:#95A59E; --line:#2A3632;
  --accent:#78C2AB; --accent-ink:#0A1814; --accent-soft:#1D3931;
  --warn:#E3A857; --warn-soft:#382A13; --bad:#F08C86; --bad-soft:#3C1D1C; --good:#90CC90; --good-soft:#1C321F;
  --info:#8DB7EA; --info-soft:#18283B; --focus:#7FB0FF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.app{max-width:1320px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;letter-spacing:0}
.topbar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.topbar select{min-width:220px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.cloud{background:var(--good-soft);color:var(--good)}
.chip.local{background:var(--warn-soft);color:var(--warn)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.req{color:var(--bad);font-weight:700}
input[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
input:not([type=checkbox]):not([type=file]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:14px;width:100%;min-width:0}
textarea{resize:vertical}
input[readonly],textarea[readonly]{background:var(--surface-2)}
input.big{font-family:var(--mono);font-size:18px;font-weight:500}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer}
.inline input{accent-color:var(--accent);width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}

/* write tab */
.split{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.sticky{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.leaf-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.leaf-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
svg.leaf{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 0 var(--line),0 6px 18px -10px rgba(0,0,0,.35);user-select:none;touch-action:none}
svg.leaf .pt{font-family:Helvetica,Arial,sans-serif;fill:var(--print)}
svg.leaf .pp{font-family:var(--sans);fill:var(--leaf-ink)}
svg.leaf .edit [data-field]{cursor:grab}
svg.leaf .sel{fill:#0F6B55}
svg.leaf .anchor{fill:#E0672B}
svg.leaf .tag{cursor:grab}svg.leaf .tag rect{fill:#E8F1EE;stroke:#0F6B55;stroke-width:.15}svg.leaf .tag text{fill:#0F6B55;font-family:Arial,sans-serif;font-weight:700}
svg.leaf .tag.on rect{fill:#0F6B55}svg.leaf .tag.on text{fill:#FFFFFF}
.notes{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;margin:10px 0 0;padding-left:18px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{border-radius:7px;padding:7px 10px;font-size:13px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.info{background:var(--info-soft);color:var(--info)}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg a{color:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.issued{border:1px solid color-mix(in srgb,var(--good) 35%,var(--line));background:var(--good-soft);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.issued b{font-family:var(--mono)}
details summary{cursor:pointer;font-weight:500;font-size:13px}
.entries{width:100%;border-collapse:collapse;margin-top:8px}
.entries td{padding:3px 3px 3px 0}
.entries input{padding:5px 7px!important;font-size:13px!important}
.entries td:nth-child(2),.entries td:nth-child(3){width:26%}
.entries td:last-child{width:30px}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t tr.void td{color:var(--muted)}
table.t tr.void td.amt{text-decoration:line-through}
table.t tr.voidrow td{background:var(--bad-soft)}
.st{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.st-Issued{background:var(--info-soft);color:var(--info)}
.st-Released{background:var(--accent-soft);color:var(--accent)}
.st-Cleared{background:var(--good-soft);color:var(--good)}
.st-Voided{background:var(--bad-soft);color:var(--bad)}
.st-Stale{background:var(--warn-soft);color:var(--warn)}
.st-Post-dated{background:var(--surface-2);color:var(--muted)}
.rowacts{display:flex;gap:4px;flex-wrap:nowrap}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:500;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:90px;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:var(--warn)}

/* layout editor */
.fgroup{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fgroup.on{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.fgroup header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fgroup header b{font-size:13px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.mini label.f{font-size:11px}
.mini input,.mini select{padding:5px 7px!important;font-size:13px!important}
.dirty{color:var(--warn);font-size:12px;font-weight:600}
.clr-wrap{position:relative;display:block}
.clr-wrap input,.clr-wrap textarea{padding-right:32px!important}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:15px;line-height:22px;padding:0;text-align:center}
.clr:hover{background:var(--line);color:var(--ink)}
.clr-wrap.ta .clr{top:8px;transform:none}
.clr-wrap :placeholder-shown + .clr{display:none}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:10;width:min(460px,calc(100% - 32px))}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
#toast div.bad{background:var(--bad);color:#fff}
#toast div.warn{background:var(--warn);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#cp-gate{padding-block:24px}
.cp-login{max-width:440px;margin:8vh auto 0}
#cp-me{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<body>


<div class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="7" width="32" height="20" rx="3" fill="var(--accent)"/><path d="M5 20h11M5 23h7" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round"/><rect x="21" y="11" width="8" height="5" rx="1" fill="none" stroke="var(--accent-ink)" stroke-width="1.4"/><path d="M19 23c2-3 3 1 5-1s2-2 5 0" stroke="var(--accent-ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Check Printer</h1><small>Pre-printed PH bank check stock · PDF output at actual size</small></div>
    </div>
    <label for="co-sel">Company <select id="co-sel"></select></label>
    <label for="out-sel" id="out-wrap" hidden>Output <select id="out-sel" style="min-width:0"><option value="print">Print directly</option><option value="download">Download PDF</option></select></label>
    <span id="store-chip" class="chip local">This browser only</span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="write">Write check</button>
    <button role="tab" data-tab="register">Register &amp; reports</button>
    <button role="tab" data-tab="accounts">Bank accounts</button>
    <button role="tab" data-tab="layouts">Layouts &amp; calibration</button>
    <button role="tab" data-tab="companies">Companies &amp; audit</button>
  </nav>
  <main>
    <section id="tab-write" data-panel="write" hidden></section>
    <section id="tab-register" data-panel="register" hidden></section>
    <section id="tab-accounts" data-panel="accounts" hidden></section>
    <section id="tab-layouts" data-panel="layouts" hidden></section>
    <section id="tab-companies" data-panel="companies" hidden></section>
  </main>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const peso = n => (Number(n) || 0).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const parseAmt = s => { const n = parseFloat(String(s ?? '').replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const r1 = v => Math.round(v * 10) / 10;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function toast(msg, kind = '') {
  const el = document.createElement('div'); el.textContent = msg; if (kind) el.className = kind;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), kind === 'bad' ? 6500 : 3800);
}
function deepMerge(t, s) { for (const k in s) { if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) { t[k] = deepMerge(t[k] && typeof t[k] === 'object' ? t[k] : {}, s[k]); } else t[k] = s[k]; } return t; }
function getPath(o, p) { return p.split('.').reduce((a, k) => a?.[k], o); }
function setPath(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => a = a[k] ??= {}); a[ks.at(-1)] = v; }

/* ---------- Philippine banks ---------- */
const BANKS = [
  ['BDO','BDO Unibank'],['BPI','Bank of the Philippine Islands'],['MBTC','Metrobank'],['LBP','LANDBANK'],
  ['PNB','Philippine National Bank'],['SECB','Security Bank'],['CBC','China Bank'],['RCBC','RCBC'],
  ['UBP','UnionBank'],['EWB','EastWest Bank'],['DBP','Development Bank of the Philippines'],['PSB','PSBank'],
  ['AUB','Asia United Bank'],['MAY','Maybank Philippines'],['PBCOM','PBCOM'],['BOC','Bank of Commerce'],
  ['PVB','Philippine Veterans Bank'],['SBA','Sterling Bank of Asia'],['PBB','Philippine Business Bank'],
  ['CSB','China Bank Savings'],['CTBC','CTBC Bank Philippines'],['OTHER','Other bank']
];
const bankName = c => (BANKS.find(b => b[0] === c) || [c, c || 'Bank'])[1];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- amount in words ---------- */
const ONES = ['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
const TENS = ['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
function w999(n) { const out = [], h = Math.floor(n / 100), r = n % 100; if (h) out.push(ONES[h] + ' HUNDRED'); if (r) out.push(r < 20 ? ONES[r] : TENS[Math.floor(r / 10)] + (r % 10 ? '-' + ONES[r % 10] : '')); return out.join(' '); }
function intWords(n) { if (n === 0) return 'ZERO'; const p = []; for (const [nm, v] of [['BILLION',1e9],['MILLION',1e6],['THOUSAND',1e3]]) { if (n >= v) { p.push(w999(Math.floor(n / v)) + ' ' + nm); n %= v; } } if (n) p.push(w999(n)); return p.join(' '); }
// o: {style: 'fraction'|'centavos', case: 'upper'|'title', pesoWord: bool, hyphen: bool}
function amountWords(amt, o = {}) {
  if (typeof o === 'string') o = {style: o};
  const cents = Math.round((Number(amt) || 0) * 100); const p = Math.floor(cents / 100), c = cents % 100;
  if (!cents) return '';
  const iw = n => o.hyphen === false ? intWords(n).replace(/-/g, ' ') : intWords(n);
  const parts = [];
  if (p) parts.push(iw(p) + (o.pesoWord === false ? '' : p === 1 ? ' PESO' : ' PESOS'));
  if (c) parts.push(o.style === 'centavos' ? iw(c) + (c === 1 ? ' CENTAVO' : ' CENTAVOS') : String(c).padStart(2, '0') + '/100' + (o.style === 'fraction_centavos' ? ' CENTAVOS' : ''));
  const s = parts.join(' AND ') + ' ONLY';
  return o.case === 'title' ? s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase()) : s;
}
function fmtDate(iso, fmt) {
  if (!iso) return ''; const [y, m, d] = iso.split('-'); const mn = MONTHS[+m - 1] || '';
  switch (fmt) {
    case 'MM/DD/YYYY': return `${m}/${d}/${y}`;
    case 'MM-DD-YYYY': return `${m}-${d}-${y}`;
    case 'MMMM DD, YYYY': return `${mn} ${d}, ${y}`;
    case 'MMM. DD, YYYY': return `${mn.slice(0,3)}. ${d}, ${y}`;
    case 'DD-MMM-YYYY': return `${d}-${mn.slice(0,3).toUpperCase()}-${y}`;
    default: return iso;
  }
}

/* ---------- layouts ---------- */
// All positions in millimetres from the top-left corner of the check leaf; y is the text baseline.
function stdLayout(code) {
  const L = {
    id: 'std-' + code, name: bankName(code) + ' · standard leaf', bank: code, std: true,
    // Positions measured from Meatplus Check Sets 1-2 (BDO, Chinabank, BPI, UnionBank, PBB, Security Bank; PCHC 8" x 3" standard).
    checkW: 203.2, checkH: 76.2, paper: 'check', placeX: 0, placeY: 0, nudgeX: 0, nudgeY: 0, scaleX: 100, scaleY: 100, bold: true, font: 'helvetica', heavy: false,
    fields: {
      date:   {show: true, x: 150.8, y: 14.2, size: 12, mode: 'boxes', fmt: 'MMMM DD, YYYY', order: 'MDY', spacing: 5.0, groupGap: 2.2, sep: ''},
      payee:  {show: true, x: 30.3, y: 22.8, size: 12, maxW: 106, stars: false, upper: true},
      amount: {show: true, x: 152.9, y: 22.5, size: 12, stars: false, prefix: ''},
      words:  {show: true, x: 21.3, y: 30.1, size: 12, maxW: 170, line2: 6, line2X: 8, style: code === 'PBB' ? 'fraction_centavos' : 'centavos', case: 'title', pesoWord: false, hyphen: false, stars: false},
      memo:   code === 'CBC' || code === 'PBB' ? {show: true, x: 192, y: code === 'PBB' ? 41 : 40, size: 12, source: 'acct', align: 'right'} : {show: false, x: 12, y: 57, size: 8, source: 'cv', align: 'left'},
      acPayee:{show: true, x: 92, y: 1.5}
    }
  };

async function saveFile(filename, data) {

    if (e?.code === 'declined') toast('Download cancelled.');

// Print a PDF directly: load it in a hidden frame and open the browser's print window.
function printBlob(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob.type ? blob : new Blob([blob], {type: 'application/pdf'}));
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:10px;height:10px;border:0;opacity:0;pointer-events:none';
    f.onload = () => setTimeout(() => {
      try { f.contentWindow.focus(); f.contentWindow.print(); }
      catch (e) { const w = window.open(url, '_blank'); if (!w) toast('Allow pop-ups for this site, or switch Output to Download PDF.', 'warn'); }
      setTimeout(() => { f.remove(); URL.revokeObjectURL(url); }, 120000);
      resolve(true);
    }, 400);
    f.src = url; document.body.appendChild(f);
    toast('Opening the print window. Use Scale: Default / Actual size (not Fit to page).');
  });
}

async function issueCheck() {
  const d = app.draft; const {acct, co, L} = syncDraftAuto(); if (!acct) return;
  const no = parseInt(d.no, 10); const data = writeData(d, acct);
  if (!no || !data.amount || !data.payee) return;
  if (findCheck(acct.id, no)) { toast('That check number is already used.', 'bad'); return; }
  const rec = {date: d.date, payee: data.payee, amount: data.amount, words: d.words, particulars: d.particulars.trim(), cvNo: d.cvNo.trim(),
    acPayee: !!d.acPayee, entries: d.entries.filter(x => x.acct || x.dr || x.cr).map(x => ({acct: x.acct, dr: parseAmt(x.dr), cr: parseAmt(x.cr)})),
    status: 'Issued', companyId: acct.companyId, createdAt: new Date().toISOString(), createdBy: ME.id || '', createdByName: ME.name || '', printed: 1};
  const btn = $('#w-issue'); btn.disabled = true;
  try {
    const b = bucketId(acct.id, no);
    await patch('checks', b, {accountId: acct.id, checks: {[no]: rec}});
    if (no >= (+acct.nextNo || 0)) await patch('accounts', acct.id, {nextNo: no + 1});
    if (d.cvAuto && co) await patch('companies', acct.companyId, {cvNext: (+co.cvNext || 1) + 1});
    audit('Issued', `${bankName(acct.bank)} ${acct.number || ''} #${padNo(acct, no)} · ${rec.payee} · ₱${peso(rec.amount)}`);
  } catch (e) { writeErr(e); btn.disabled = false; return; }
  app.last = {accountId: acct.id, no};
  const alsoV = d.alsoVoucher;
  app.draft = newDraft(acct.id); app.draft.alsoVoucher = alsoV; app.draft.date = d.date;
  fillWriteInputs(); updateWrite(true);
  toast(`Check ${padNo(acct, no)} saved to the register.`);
  const full = {...rec, no, accountId: acct.id, noStr: padNo(acct, no)};
  await saveFile(`Check-${acct.bank}-${padNo(acct, no)}.pdf`, checkPdf(L, {...full, acctNo: acct.number}));
  if (alsoV) await saveFile(`Voucher-${rec.cvNo || padNo(acct, no)}.pdf`, voucherPdf(full));
}
async function reprint(acctId, no, voucher) {
  const acct = S.accounts[acctId]; const r = findCheck(acctId, no); if (!acct || !r) return;
  const full = {...r, no, accountId: acctId, noStr: padNo(acct, no)};

}

async function regAction(e) {

  if (act === 'canceldel') { app.delOpen = null; renderRegister(); return; }
  if (act === 'delete' || act === 'reissue') { app.delOpen = {key: b.dataset.k, reissue: act === 'reissue'}; app.voidOpen = null; renderRegister(); return; }
  const [acctId, n] = b.dataset.k.split('|'); const no = +n; const r = findCheck(acctId, no); const a = S.accounts[acctId];
  if (act === 'void') { app.voidOpen = b.dataset.k; renderRegister(); return; }
  const stamp = new Date().toISOString();
  try {
    await patch('checks', bucketId(acctId, no), {checks: {[no]: act === 'Released' ? {status: 'Released', releasedAt: stamp} : {status: 'Cleared', clearedAt: stamp}}});
    audit('Marked ' + act.toLowerCase(), `${bankName(a?.bank)} #${padNo(a, no)} · ${r?.payee}`);
  } catch (err) { writeErr(err); }
}

  const fg = t.closest('[data-fg]'); if (fg) selectField(fg.dataset.fg);
  if (p === 'paper') { renderLayouts(true); return; }
  refreshLayoutPreview();
}
function selectField(f) { if (app.layoutSel === f) return; app.layoutSel = f; $$('[data-fg]').forEach(g => g.classList.toggle('on', g.dataset.fg === f)); }
function refreshLayoutPreview() {
  const L = app.layoutDraft; if (!$('#l-leaf')) return;
  const u = accountList('ALL').find(a => (a.layoutId || 'std-' + a.bank) === app.layoutId);
  const sd = {...sampleData(L), ...(u ? {acctNo: u.number, acctName: u.name, branch: u.branch, brstn: u.brstn, noStr: padNo(u, u.nextNo)} : {})};
  $('#l-leaf').innerHTML = leafSVG(L, sd, {editable: true, selected: app.layoutSel, plain: !app.layoutDesign});
  const F = L.fields[app.layoutSel]; $('#l-pos').textContent = F ? `${app.layoutSel}  x ${r1(+F.x)}  y ${r1(+F.y)} mm` : '';
}
let drag = null;
window.addEventListener('pointermove', e => {
  if (!drag) return; const F = app.layoutDraft.fields[drag.f];
  F.x = r1(drag.x + (e.clientX - drag.sx) * drag.k); F.y = r1(drag.y + (e.clientY - drag.sy) * drag.k);
  app.layoutDirty = true; refreshLayoutPreview();
});
window.addEventListener('pointerup', () => {
  if (!drag) return; const f = drag.f; drag = null;
  const set = (p, v) => { const i = $(`[data-p="${p}"]`); if (i) i.value = v; };
  set(`fields.${f}.x`, app.layoutDraft.fields[f].x); set(`fields.${f}.y`, app.layoutDraft.fields[f].y);
  if ($('#l-dirty')) $('#l-dirty').textContent = app.layoutDirty ? 'Unsaved changes' : '';
  $(`[data-fg="${f}"]`)?.scrollIntoView({block: 'nearest', behavior: 'smooth'});
});
function bindDrag() {
  const box = $('#l-leaf');
  box.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-field]'); if (!t) return; e.preventDefault();
    const f = t.dataset.field; const F = app.layoutDraft.fields[f];
    selectField(f); const rect = box.querySelector('svg').getBoundingClientRect();
    drag = {f, sx: e.clientX, sy: e.clientY, x: +F.x, y: +F.y, k: +app.layoutDraft.checkW / rect.width};
    refreshLayoutPreview();
  });
  box.addEventListener('keydown', e => {
    const F = app.layoutDraft.fields[app.layoutSel]; if (!F) return;
    const step = e.shiftKey ? 1 : 0.1; const m = {ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step]}[e.key];
    if (!m) return; e.preventDefault(); F.x = r1(+F.x + m[0]); F.y = r1(+F.y + m[1]); app.layoutDirty = true; refreshLayoutPreview();
    const i1 = $(`[data-p="fields.${app.layoutSel}.x"]`), i2 = $(`[data-p="fields.${app.layoutSel}.y"]`); if (i1) i1.value = F.x; if (i2) i2.value = F.y;
  });
  box.tabIndex = 0; box.setAttribute('aria-label', 'Check leaf. Drag a field, or select one and use arrow keys (Shift for 1 mm steps).');
}
async function saveLayout(asCopy) {
  const L = clone(app.layoutDraft);
  const id = asCopy ? 'lay' + uid() : app.layoutId;
  if (asCopy) L.name = (L.name || 'Layout') + ' (copy)';
  delete L.id; L.std = false;
  try { await put('layouts', id, L); audit(asCopy ? 'Created layout' : 'Saved layout', L.name); toast('Layout saved.'); app.layoutId = id; app.layoutDraft = null; renderLayouts(true); }
  catch (e) { writeErr(e); }
}

/* ---------- COMPANIES, BACKUP & AUDIT ---------- */
let profileNames = {};
function renderCompanies(force = true) {
  if (!force && (app.coEdit && $('#c-form') || app.importData)) return;
  const el = $('#tab-companies'); const cos = companyList(); const ed = app.coEdit;
  const entries = Object.values(S.audit).flatMap(m => Object.values(m.entries || {})).sort((a, b) => b.t.localeCompare(a.t)).slice(0, 150);
  el.innerHTML = `<div class="split">
    <div class="form">
    ${ed ? `<form class="card form" id="c-form"><h2>${ed.id ? 'Edit company' : 'Add company'}</h2>
      <label class="f">Registered name<input id="c-name" required value="${esc(ed.name)}"></label>
      <div class="row"><label class="f">Short name<input id="c-short" value="${esc(ed.short)}" placeholder="e.g. MTC"></label><label class="f">TIN<input id="c-tin" class="mono" value="${esc(ed.tin)}" placeholder="000-000-000-000"></label></div>
      <label class="f">Address<textarea id="c-addr" rows="2">${esc(ed.address)}</textarea></label>
      <div class="row"><label class="f">CV prefix<input id="c-cvp" value="${esc(ed.cvPrefix || 'CV')}"></label><label class="f">Next CV no.<input id="c-cvn" class="mono" inputmode="numeric" value="${esc(ed.cvNext || 1)}"></label></div>
      <h3>Voucher signatories</h3>
      <div class="row"><label class="f">Prepared by<input id="c-prep" value="${esc(ed.prepared)}"></label><label class="f">Checked by<input id="c-chk" value="${esc(ed.checked)}"></label><label class="f">Approved by<input id="c-appr" value="${esc(ed.approved)}"></label></div>
      <div class="actions"><button class="btn primary">Save company</button><button type="button" class="btn" id="c-cancel">Cancel</button></div></form>`
    : `<div class="card form"><div class="sec-head"><h2>Companies</h2><button class="btn primary sm" id="c-new">Add company</button></div>
      <div class="table-wrap" style="border:0"><table class="t"><thead><tr><th>Company</th><th>Next CV</th><th></th></tr></thead><tbody>
      ${cos.map(c => `<tr><td><b>${esc(c.name)}</b><div class="hint">${esc(c.short || '')}${c.tin ? ' · TIN ' + esc(c.tin) : ''}</div></td><td class="mono">${esc(nextCv(c))}</td><td><button class="btn sm" data-cedit="${c.id}">Edit</button></td></tr>`).join('') || `<tr><td colspan="3" class="empty">No companies yet.</td></tr>`}
      </tbody></table></div></div>`}
      <div class="card form"><h2>Backup</h2>
        <p class="muted" style="margin:0">${DB ? 'Records are stored in this page\'s shared database. Download a backup regularly for your files.' : 'Records are stored in this browser only. Download a backup often, and before clearing browser data.'}</p>
        <div class="actions"><button class="btn" id="b-exp">Download backup (.json)</button><label class="btn" for="b-imp">Restore from backup…</label><input type="file" id="b-imp" accept=".json,application/json" hidden></div>
        <div id="b-msg"></div>
      </div>
    </div>
    <div><div class="sec-head" style="margin-bottom:10px"><h2>Audit log</h2><span class="hint">Latest ${entries.length} actions</span></div>
      <div class="table-wrap"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>
      ${entries.map(a => `<tr><td class="mono" style="white-space:nowrap">${esc(a.t.slice(0, 16).replace('T', ' '))}</td><td>${esc(profileNames[a.by] || a.byName || (a.by ? 'Member' : '—'))}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">Nothing logged yet.</td></tr>`}
      </tbody></table></div></div></div>`;
  $('#c-new')?.addEventListener('click', () => { app.coEdit = {name: '', short: '', tin: '', address: '', cvPrefix: 'CV', cvNext: 1}; renderCompanies(); });
  $$('[data-cedit]').forEach(b => b.addEventListener('click', () => { app.coEdit = {...clone(S.companies[b.dataset.cedit]), id: b.dataset.cedit}; renderCompanies(); }));
  $('#c-cancel')?.addEventListener('click', () => { app.coEdit = null; renderCompanies(); });
  $('#c-form')?.addEventListener('submit', async e => {
    e.preventDefault(); const id = ed.id || 'c' + uid();
    const data = {...(ed.id ? clone(S.companies[ed.id]) : {}), name: $('#c-name').value.trim(), short: $('#c-short').value.trim(), tin: $('#c-tin').value.trim(), address: $('#c-addr').value.trim(), cvPrefix: $('#c-cvp').value.trim() || 'CV', cvNext: parseInt($('#c-cvn').value, 10) || 1, prepared: $('#c-prep').value.trim(), checked: $('#c-chk').value.trim(), approved: $('#c-appr').value.trim()};
    if (!data.name) return;
    try { await put('companies', id, data); audit(ed.id ? 'Updated company' : 'Added company', data.name); toast('Company saved.'); app.coEdit = null; renderCompanies(); } catch (err) { writeErr(err); }
  });
  $('#b-exp').addEventListener('click', async () => { if (await saveFile(`check-printer-backup-${todayISO()}.json`, JSON.stringify({app: 'check-printer', version: 1, exportedAt: new Date().toISOString(), data: S}, null, 1))) audit('Downloaded backup', ''); });
  $('#b-imp').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => {
      try { const j = JSON.parse(rd.result); if (!j.data || !COLS.every(c => typeof (j.data[c] ?? {}) === 'object')) throw 0; app.importData = j.data;
        const n = c => Object.keys(j.data[c] || {}).length;
        $('#b-msg').innerHTML = `<div class="msg warn">Restore ${n('companies')} companies, ${n('accounts')} accounts, ${n('layouts')} layouts and ${allChecksIn(j.data)} checks? Records with the same IDs will be replaced. <a id="b-ok">Restore now</a></div>`;
        $('#b-ok').addEventListener('click', doImport);
      } catch { $('#b-msg').innerHTML = `<div class="msg bad">That file is not a Check Printer backup.</div>`; }
    };
    rd.readAsText(file); e.target.value = '';
  });
  const ids = [...new Set(entries.map(a => a.by).filter(id => id && !profileNames[id]))];
  if (ids.length && USER?.profiles) USER.profiles(ids).then(ps => { let ch = false; for (const id of ids) { const n = ps?.[id]?.name; if (n) { profileNames[id] = n; ch = true; } } if (ch && app.tab === 'companies') renderCompanies(false); }).catch(() => {});
}
const allChecksIn = d => Object.values(d.checks || {}).reduce((s, b) => s + Object.keys(b.checks || {}).length, 0);
async function doImport() {
  const d = app.importData; if (!d) return; let n = 0;
  try { for (const c of COLS) for (const [id, v] of Object.entries(d[c] || {})) { await put(c, id, v); n++; } audit('Restored backup', n + ' records'); toast(`Restored ${n} records.`); }
  catch (e) { writeErr(e); }
  app.importData = null; $('#b-msg').innerHTML = '';
}

/* ---------- boot ---------- */
(function boot() {
  const h = (location.hash || '').slice(1); if (['write','register','accounts','layouts','companies'].includes(h)) app.tab = h;
  const local = lsGet(LSKEY, null); if (local) for (const c of COLS) S[c] = local[c] || {};
  renderAll(true);
  if (!window.claude?.use) return;
  claude.use('downloads').then(d => DL = d).catch(() => {});
  claude.use('user').then(async u => { USER = u; if (!u) return; try { ME.id = await u.id(); const me = await u.me(); ME.name = me?.name || ''; } catch {} }).catch(() => {});
  claude.use('db').then(db => {
    if (!db) return; DB = db; S = {companies: {}, accounts: {}, layouts: {}, checks: {}, audit: {}}; renderAll(true);
    for (const c of COLS) db.collection(c).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[c] = m;
      if (c === 'layouts' && app.layoutDirty === false) app.layoutDraft = null;
      if (c === 'layouts' || c === 'companies') mounted.layouts = false;
      scheduleRender();
    }, err => { if (err?.code !== 'revoked') toast('Live updates stopped (' + err.code + '). Reload the page.', 'warn'); });
  }).catch(() => {});
})();
</script>

<script src="supabase-layer.js"></script>
</body>
